name: conformance-drift-monitor

on:
  schedule:
    # Daily 07:00 UTC = 03:00 America/New_York during EDT (02:00 during EST).
    # GitHub cron is UTC-only and does not track DST, so the wall-clock time
    # shifts by an hour across the DST boundary; this targets the 03:00 ET run
    # for the EDT half of the year.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write # commit the updated registry
  actions: read # read platform-conformance workflow-run status
  issues: write # open/update the drift report issue

jobs:
  drift-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan org and update registry
        env:
          # DRIFT_MONITOR_TOKEN lets the scan see private repos across the org;
          # the default token only sees this repo. On private repos the scan
          # needs, per endpoint it calls:
          #   - Contents: read   → .platform-conformance.yml + repo listing
          #   - Actions:  read   → platform-conformance workflow-runs status
          #   - Issues:   write  → open/update the drift report issue
          # A PAT/App token missing any of these 403s and aborts the scan. When
          # the secret is unset we fall back to github.token, which already has
          # contents:write + actions:read + issues:write on this repo from the
          # job `permissions` below (that fallback only sees this repo, so
          # cross-org drift is skipped until the PAT is provisioned).
          GITHUB_TOKEN: ${{ secrets.DRIFT_MONITOR_TOKEN || github.token }}
          ORG: ${{ github.repository_owner }}
          META_REPO: ${{ github.event.repository.name }}
          REGISTRY_PATH: product-registry.md
          # Non-product repos with no registry row — never flagged as
          # unregistered. `core` is the shared platform, not a product.
          IGNORE_REPOS: core
        run: node scripts/drift-monitor.mjs

      - name: Commit registry changes
        run: |
          if git diff --quiet product-registry.md; then
            echo "Registry unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-registry.md
          git commit -m "chore: update conformance registry ($(date -u +%F))"
          # main may have moved while the scan ran (a merge, or a concurrent
          # run). Rebase the registry commit onto the latest tip and retry so a
          # non-fast-forward push doesn't silently drop the update.
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing on origin/$branch and retrying"
            git pull --rebase origin "$branch"
          done
          echo "::error::could not push registry update after 3 attempts"
          exit 1
