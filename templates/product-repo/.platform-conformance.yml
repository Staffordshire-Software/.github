# Platform Conformance configuration for {{REPO_SLUG}}
#
# TODO: sync from core#53 — the canonical schema is defined by
# https://github.com/Staffordshire-Software/core/issues/53. Until that lands,
# this file follows the draft shape below. Field semantics:
#
#   required — drift on this check fails the platform-conformance workflow (🔴)
#   warned   — drift is reported as a warning but does not block merge (🟡)
#   exempt   — check is skipped for this repo (justify in the comment)
#
# MVP-push default: every check starts at `warned`. Ratchet checks to
# `required` as the product hardens. See DEFINITION_OF_DONE.md in
# Staffordshire-Software/.github for what each check means.

version: 1

product:
  key: "{{PRODUCT_KEY}}"
  repo: "{{ORG}}/{{REPO_SLUG}}"
  description: "{{DESCRIPTION}}"

checks:
  auth_via_core_client: warned        # DoD §1 — auth through @staffysoft/core-client
  entitlements_via_core: warned       # DoD §2 — getEntitlements(), fail closed
  no_committed_secrets: warned        # DoD §3 — secrets in Vercel env / 1Password only
  dependabot_enabled: warned          # DoD §3 — Dependabot for npm + Actions
  security_headers: warned            # DoD §3 — CSP, HSTS, X-Frame-Options, Referrer-Policy
  rate_limiting: warned               # DoD §3 — auth + write endpoints
  sentry_wired: warned                # DoD §4 — errors to Sentry
  health_endpoint: warned             # DoD §4 — /api/health covers DB + core
  reversible_migrations: warned       # DoD §4 — every migration documents rollback
  analytics_via_core: warned          # DoD §5 — trackEvent through core
  ci_required_checks: warned          # DoD §7 — typecheck, lint, test, build on every PR
  mobile_responsive: warned           # DoD §8 — phone-first responsive
  accessibility_aa: warned            # DoD §8 — WCAG AA contrast + keyboard nav
  docs_complete: warned               # DoD §9 — README, ADRs, RUNBOOK
